# Version catalog for recipe-app (single-module Kotlin, Compose, MVVM).
# Every "verified" version was read on 2026-10-08 from the source named beside it.
# Stable releases only: alpha/beta/RC builds were filtered out of every lookup.

[versions]
# Android Gradle Plugin. Newest stable is 9.4.1; 9.5.0-alpha08 exists and is excluded.
# source: https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml
agp = "9.4.1"
# Kotlin. Newest stable is 2.4.21; 2.5.0-Beta1 exists and is excluded.
# source: https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml
kotlin = "2.4.21"
# Compose BOM 2026.09.00 pins compose ui/foundation/runtime 1.12.1 and material3 1.4.0
# (read from the BOM POM).
# source: https://dl.google.com/android/maven2/androidx/compose/compose-bom/maven-metadata.xml
composeBom = "2026.09.00"
# source: https://dl.google.com/android/maven2/androidx/core/core-ktx/maven-metadata.xml
coreKtx = "1.19.1"
# Newest stable is 2.11.0; 1.14.0-alpha03 excluded.
# source: .../androidx/lifecycle/lifecycle-viewmodel-compose/maven-metadata.xml
lifecycle = "2.11.0"
# Newest stable is 1.13.0; 1.14.0-alpha11 excluded.
# source: .../androidx/activity/activity-compose/maven-metadata.xml
activityCompose = "1.13.0"
# source: .../androidx/navigation/navigation-compose/maven-metadata.xml
navigationCompose = "2.10.2"
# Newest stable is 1.2.1; 1.3.0-alpha11 excluded.
# source: .../androidx/datastore/datastore-preferences/maven-metadata.xml
datastore = "1.2.1"
# Newest stable is 1.11.0; 1.12.0-RC excluded.
# source: https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-serialization-json/maven-metadata.xml
serialization = "1.11.0"
# source: https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-test/maven-metadata.xml
coroutines = "1.11.0"
# source: https://repo1.maven.org/maven2/junit/junit/maven-metadata.xml
junit = "4.13.2"
# source: https://repo1.maven.org/maven2/io/mockk/mockk/maven-metadata.xml
mockk = "1.14.11"
# source: https://repo1.maven.org/maven2/app/cash/turbine/turbine/maven-metadata.xml
turbine = "1.2.1"
# source: .../androidx/test/ext/junit/maven-metadata.xml
androidxTestExtJunit = "1.3.0"
# source: .../androidx/test/espresso/espresso-core/maven-metadata.xml
espresso = "3.7.0"
# Coil 3 — image loading for Compose. Newest stable is 3.0.4; 3.1.0-alpha02 excluded.
# source: https://dl.google.com/android/maven2/io/coil-kt/coil3/coil3-metadata/maven-metadata.xml
coil3 = "3.0.4"

# Build config values (referenced from app/build.gradle.kts, not plugin or library versions)
# compileSdk 37: platform "platforms;android-37.0" is on channel-0 (stable) in
#   https://dl.google.com/android/repository/repository2-3.xml
#   AGP 9.4 supports up to API 37 (release-notes page above).
#   Newer entries 37.1 and 37.2 exist; AGP 9.4 does not support them, so they are not used.
compileSdk = "37"
# targetSdk = 37 (equals compileSdk; verified against AGP 9.4 release notes)
targetSdk = "37"
# minSdk = 30 (matches "Android 11 or later" from the Commander's answer; a design choice)
minSdk = "30"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Compose: versions come from the BOM, so no version.ref on these.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# kotlinx
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Image loading
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test-lib = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-foundation",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
